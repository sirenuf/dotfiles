# /etc/environment.d/50-enuf.conf
# Shared by systemd (environment.d) and /etc/zsh/zshenv.
#
# This file should only set ENVs that change relative
# and other config locations.

XDG_CONFIG_HOME=${HOME}/.config
XDG_CACHE_HOME=${HOME}/.cache
XDG_DATA_HOME=${HOME}/.local/share
XDG_STATE_HOME=${HOME}/.local/state

# Important 
ZDOTDIR=${XDG_CONFIG_HOME}/zsh

# Garbage
PULSE_COOKIE=${XDG_CONFIG_HOME}/pulse/cookie
NPM_CONFIG_CACHE=${XDG_CACHE_HOME}/npm
CUDA_CACHE_PATH=${XDG_CACHE_HOME}/nv
NODE_REPL_HISTORY=${XDG_STATE_HOME}/node_repl_history
CALCHISTFILE=${XDG_CACHE_HOME}/calc_history
GTK2_RC_FILES=${XDG_CONFIG_HOME}/gtk-2.0/gtkrc

# Default dirs
CARGO_HOME=${XDG_DATA_HOME}/cargo
WINEPREFIX=${XDG_DATA_HOME}/wine

# Config ENVs
GIT_CONFIG_GLOBAL=${XDG_CONFIG_HOME}/git/config
CLAUDE_CONFIG_DIR=${XDG_CONFIG_HOME}/claude
